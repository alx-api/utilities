<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tournament Leaderboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="./css/styles.css" rel="stylesheet">

</head>
<body>

<div class="wrapper">

    <div class="title">
        STANDINGS
    </div>

    <div class="board">

        <div class="column" id="left-column"></div>

        <div class="column" id="right-column"></div>

    </div>

</div>

<script src="./js/leaderboard.js"></script>

<script>
let map_count=0;
let squads_alive=0;
let event_name="CoD WZ RSS";

async function loadLeaderboard() {

    const url =
        "https://json-live-merge.ialexk.workers.dev/";

    const response = await fetch(url,{
      cache: "no-store",
    });

    const json = await response.json();

    map_count = json.map_number;
    event_name = json.event_name;
    squads_alive = json.squads_alive || 0;

    const teamsByName = new Map(
      json.teams.map(team => [
        team.team_name,
        team
      ])
    );

    const leaderboard = json.standings
        .map((team) => {

          const liveTeam =
            teamsByName.get(team.team_name);

          return {
            rank: team.rank,

            maps: map_count,

            team: team.team_name,

            points: team.final_score,

            kills: team.total_kills,

            squads_alive: squads_alive,

            players_alive: liveTeam?.players?.filter(
                            player => !player.is_dead
                          ).length ?? 0,

            players: team.players
                ?.map(player => `${player.name} ${player.kills}<svg class="icon"><use href="./icons/icons.svg#target"></use></svg>`)
                .join(" ")
          };
        })
        .sort((a,b) => a.rank - b.rank)
        .slice(0,16);

    renderLeaderboard(leaderboard);
}

loadLeaderboard();

 //setInterval(loadLeaderboard, 8000);

</script>

</body>
</html>
