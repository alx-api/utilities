<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tournament Leaderboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="./css/styles.css" rel="stylesheet">

</head>
<body>

<div class="wrapper">

    <div class="title">
        STANDINGS
    </div>

    <div class="board-br">

        <div class="column-3" id="column-1"></div>
        <div class="column-3" id="column-2"></div>
        <div class="column-3" id="column-3"></div>

    </div>

</div>

<script src="./js/leaderboard.js"></script>

<script>
let map_count=0;
let squads_alive=0;
let event_name="";
let provider="";
let qualificationType="";
let qualificationValue=0;

const hostname = window.location.hostname;

const isLocal = 
  hostname  === "localhost" ||
  hostname  === "127.0.0.1";

const ENV = isLocal ? "dev" : "prod";

const API = {
  dev: "https://api-dev.ialexk.workers.dev",
  prod: "https://api.ialexk.workers.dev"
};

let API_BASE = API[ENV];

async function loadMetaData() {
  const url = `${API_BASE}/config`;
  const response = await fetch(url,{
    cache: "no-store",
  });

  const json = await response.json();

  provider=json.provider || "stathawk";
  event_name=json.title || "Live Standings";
  qualificationType=json.qualificationType || "matchpoint";
  qualificationValue=json.qualificationValue || 150;

}

async function loadLeaderboard() {

    const url = `${API_BASE}/`;

    const response = await fetch(url,{
      cache: "no-store",
    });

    const json = await response.json();

    map_count = json.map_number || json.map_count || 0;
    squads_alive = json.squads_alive || 0;

    /* const teamsByName = new Map(
      json.teams.map(team => [
        team.team_name,
        team
      ])
    ); */

    const leaderboard = json.standings
        .map((team) => {

          /* const liveTeam =
            teamsByName.get(team.team_name); */

          return {
            rank: team.rank,

            maps: team.map_count,

            team: (provider === "ig" || provider === "lo")
                    ? `${team.players[0].name} ${team.team_name}`
                    : provider === "rp"
                      ? team.team_name.split(" ")[0]
                      : team.team_name,
            
            /* filtered: team.players?.some(
                    player => requestedPlayersSet.has(normalize(player.name))
                  ) ?? false, */
            flagged: team.flagged,

            highlighted: team.highlighted,

            points: team.final_score,

            kills: team.total_kills,

            squads_alive: squads_alive,

            /* players_alive: liveTeam?.players?.filter(
                            player => !player.is_dead
                          ).length ?? 0, */

            players: team.players
                ?.map(
                  player => `
                  <div class="player-stat">
                    <span class="player-name">
                    ${player.name}
                    </span>
                    <span class="player-kills">
                    ${Array.isArray(player.kills)
                    ? player.kills.reduce((sum, kill) => sum + kill, 0)
                    : player.kills}
                    <svg class="icon"><use href="./icons/icons.svg#target"></use></svg>
                    </span>
                  </div>`
                )
                .join(" <span class='player-separator'>|</span> ")
          };
        })
        .sort((a, b) => {
          const aHasRank = a.rank != null && Number.isFinite(Number(a.rank));
          const bHasRank = b.rank != null && Number.isFinite(Number(b.rank));

          if (aHasRank && bHasRank) return Number(a.rank) - Number(b.rank);
          if (aHasRank) return -1;
          if (bHasRank) return 1;
          return 0;
        })
        //.slice(0,16);

    renderLeaderboard(leaderboard);
}

async function init() {
    await loadMetaData();
    await loadLeaderboard();

    setInterval(loadLeaderboard, 8000);
}

init();
</script>

</body>
</html>
