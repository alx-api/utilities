<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tournament Leaderboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="./css/styles.css" rel="stylesheet">

</head>
<body>

<div class="wrapper">

    <div class="title">
        STANDINGS
    </div>

    <div class="board">

        <div class="column" id="left-column"></div>

        <div class="column" id="right-column"></div>

    </div>

</div>

<script src="./js/leaderboard.js"></script>

<script>
let map_count=0;
let event_name="CoD WZ RSS";
const params = new URLSearchParams(window.location.search);
const EVENT_ID = params.get("event");
const eventNames = [
    {"id": "CODWRS_2026_Championship_G_AExt",
    "name": "Group Stage - A"},
    {"id": "CODWRS_2026_Championship_G_BExt",
    "name": "Group Stage - B"}
    ];

async function loadLeaderboard() {

    const url =
        `https://json-scores.ialexk.workers.dev/?event=${EVENT_ID}`;

    const response = await fetch(url);

    const json = await response.json();

    const lastPlacement =
        Array.isArray(json.standings)
            ? json.standings.at(-1)
            : undefined;

    map_count = lastPlacement.placements
                .filter(v => Number(v) !== 0)
                .length;

    nameMap = Object.fromEntries(
        eventNames.map(team => [team.id, team.name])
    );

    event_name = nameMap[EVENT_ID];

    const leaderboard = json.standings
        .map((team) => ({

            rank: team.rank,

            maps: team.placements
                .filter(v => Number(v) !== 0)
                .length,

            team: team.team_name,

            points: team.final_score,

            kills: team.total_kills,

            players: team.players
                ?.map(player => `${player.name} - ${player.kills} ☠️`)
                .join(" • ")

        }))

        .sort((a,b) => a.rank - b.rank)

        .slice(0,16);

    renderLeaderboard(leaderboard);
}

loadLeaderboard();

setInterval(loadLeaderboard, 8000);

</script>

</body>
</html>
