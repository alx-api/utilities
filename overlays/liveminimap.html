<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Player Map</title>
  <link rel="stylesheet" href="./css/styles-minimap.css" />
</head>
<body>
  <main id="map" class="map" aria-label="Live player map">
    <img
      id="map-image"
      class="map__image"
      src="./assets/havens.png"
      alt=""
      draggable="false"
    />

    <div id="markers" class="markers" aria-live="polite"></div>

    <aside id="status" class="status status--loading">
      Connecting…
    </aside>

    <section id="legend" class="legend" aria-label="Team colors"></section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
